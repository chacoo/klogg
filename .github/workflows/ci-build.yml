name: "CI Build"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  workflow_dispatch:
    inputs:
      windows_asan:
        description: Diagnose Windows memory errors with AddressSanitizer
        type: boolean
        default: false

jobs:
  SaveVersion:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/klogg-version

      - name: Save version 
        run: echo $KLOGG_VERSION > klogg_version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: klogg_version
          path: 'klogg_version.txt'
          if-no-files-found: error

  Linux:
    if: "!inputs.windows_asan && !contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu_noble
            os_version: 24.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: noble
            package_suffix: deb
            check_container: ubuntu:24.04
            container_root: docker/ubuntu24.04
            container: variar/klogg_ubuntu24.04
            cmake_opts:


    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      #- uses: satackey/action-docker-layer-caching@v0.0.11
      #  # Ignore the failure of a step and avoid terminating the job.
      #  continue-on-error: true
      
      - name: Build container 
        run: |
          cd ${{ matrix.config.container_root }}
          docker build -t ${{ matrix.config.container }} .

      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/docker-build
      - uses: ./.github/actions/docker-run-tests
      - uses: ./.github/actions/docker-package
          
# Final upload of all packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error      

  Mac:
    if: "!inputs.windows_asan && !contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos
            os_version: 14
            qt_version: 6.7.3
            qt_arch: clang_64
            qt_modules: qt5compat
            arch: arm64
            artifacts_id: macos-arm-qt6
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_OSX_ARCHITECTURES=arm64

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Xcode and SDK
        shell: sh
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

#Install build deps
      - name: Set brew env
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        run: |
          brew install ragel

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-mac
        with:
          p12-file-base64: ${{ secrets.CODESIGN_BASE64 }}
          p12-password: ${{ secrets.CODESIGN_PASSWORD }}
          notarization-username: ${{ secrets.NOTARIZATION_USERNAME }}
          notarization-team: ${{ secrets.NOTARIZATION_TEAM }}
          notarization-password: ${{ secrets.NOTARIZATION_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*' 
          if-no-files-found: error

  Windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows
            os_version: 2022
            qt_version: 6.7.3
            qt_modules: qt5compat
            qt_arch: win64_msvc2019_64
            arch: x64
            ssl_arch: -x64
            cmake_opts:
            artifacts_id: windows-x64-qt6

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v3

      - name: Cache openssl
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\openssl-1.1
          key: OpensslCache-1-1-1w

      - name: Download openssl
        if: ${{ steps.cache-openssl.outputs.cache-hit != 'true' }} 
        run: |
          Invoke-WebRequest -Uri "https://www.firedaemon.com/download-firedaemon-openssl-1.1.1-zip" -OutFile openssl.zip
          7z x openssl.zip 

      - name: Set openssl paths
        shell: sh
        run: |
          echo "SSL_DIR=${{ github.workspace }}\openssl-1.1\${{ matrix.config.arch }}\bin" >> $GITHUB_ENV
          echo "SSL_ARCH=${{ matrix.config.ssl_arch }}" >> $GITHUB_ENV 

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      
      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - name: Enable memory diagnostics
        if: inputs.windows_asan
        shell: pwsh
        run: |
          $options = "$env:KLOGG_CMAKE_OPTS -DKLOGG_USE_LTO=OFF -DTBB_ENABLE_IPO=OFF -DKLOGG_USE_SENTRY=OFF -DMI_TRACK_ASAN=ON -DCMAKE_TRY_COMPILE_CONFIGURATION=RelWithDebInfo -DCMAKE_C_FLAGS=/fsanitize=address -DCMAKE_CXX_FLAGS=/fsanitize=address"
          $options += ' -DCMAKE_EXE_LINKER_FLAGS=/INCREMENTAL:NO -DCMAKE_SHARED_LINKER_FLAGS=/INCREMENTAL:NO -DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO=/DEBUG -DCMAKE_SHARED_LINKER_FLAGS_RELWITHDEBINFO=/DEBUG'
          "KLOGG_CMAKE_OPTS=$options" >> $env:GITHUB_ENV
          'MSYS2_ARG_CONV_EXCL=-DCMAKE_C_FLAGS=;-DCMAKE_CXX_FLAGS=;-DCMAKE_EXE_LINKER_FLAGS=;-DCMAKE_SHARED_LINKER_FLAGS=;-DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO=;-DCMAKE_SHARED_LINKER_FLAGS_RELWITHDEBINFO=' >> $env:GITHUB_ENV

      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - name: Repeat integration tests under AddressSanitizer
        if: inputs.windows_asan
        shell: pwsh
        run: ctest --test-dir $env:KLOGG_BUILD_ROOT -R klogg_itests --repeat until-fail:20 --output-on-failure
      - name: Upload memory diagnostic logs
        if: always() && inputs.windows_asan
        uses: actions/upload-artifact@v4
        with:
          name: windows-asan-logs
          path: '${{ env.KLOGG_BUILD_ROOT }}/Testing/Temporary/*'
          if-no-files-found: warn
      - uses: ./.github/actions/agent-package-win
        if: '!inputs.windows_asan'
        with:
          s3-key-id: ${{ secrets.WIN_CS_KEY_ID }}
          s3-secret: ${{ secrets.WIN_CS_SECRET }}
          s3-bucket: ${{ secrets.WIN_CS_BUCKET }}
     
# Final upload of all packages
      - uses: actions/upload-artifact@v4
        if: '!inputs.windows_asan'
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error
